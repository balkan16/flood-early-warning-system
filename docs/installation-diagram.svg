<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#f0f9ff"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <style>
      .t{font-size:13px;fill:#0f172a}.s{font-size:11px;fill:#334155}.b{font-weight:700}
      .lvl{stroke-width:1.5;stroke-dasharray:6 4}.wave{fill:none;stroke:#c2410c;stroke-width:2;opacity:.75}
      .sms{fill:none;stroke:#c2410c;stroke-width:2;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1280" height="740" fill="url(#sky)"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Installation Overview</text>
  <text x="30" y="56" class="s">Schematic, not to scale. Riverside sensor node + siren tower in the neighborhood.</text>

  <!-- ground with river channel cut out -->
  <path d="M0 620 L330 620 L330 420 L1280 420 L1280 650 L0 650 Z" fill="#a8a29e"/>
  <rect x="330" y="420" width="950" height="8" fill="#84cc16" opacity=".7"/>
  <rect x="330" y="420" width="12" height="200" fill="#94a3b8"/>
  <text x="200" y="642" text-anchor="middle" class="s" fill="#f8fafc" style="fill:#f8fafc">river bed</text>

  <!-- water (normal) -->
  <path d="M0 580 L330 580 L330 620 L0 620 Z" fill="#60a5fa" opacity=".85"/>
  <text x="24" y="603" class="s" style="fill:#0c4a6e">normal water level</text>

  <!-- alert levels -->
  <g class="s">
    <line x1="0" y1="460" x2="330" y2="460" class="lvl" stroke="#dc2626"/><text x="24" y="455" class="b" style="fill:#dc2626">SIAGA 1 (highest)</text>
    <line x1="0" y1="490" x2="330" y2="490" class="lvl" stroke="#ea580c"/><text x="24" y="485" class="b" style="fill:#ea580c">SIAGA 2</text>
    <line x1="0" y1="520" x2="330" y2="520" class="lvl" stroke="#ca8a04"/><text x="24" y="515" class="b" style="fill:#ca8a04">SIAGA 3</text>
    <line x1="0" y1="550" x2="330" y2="550" class="lvl" stroke="#65a30d"/><text x="24" y="545" class="b" style="fill:#65a30d">SIAGA 4</text>
  </g>

  <!-- stilling pipe -->
  <rect x="302" y="392" width="22" height="228" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="304" y="580" width="18" height="40" fill="#60a5fa" opacity=".85"/>
  <g fill="#fde68a" stroke="#a16207">
    <rect x="305" y="453" width="16" height="12" rx="5"/><rect x="305" y="483" width="16" height="12" rx="5"/>
    <rect x="305" y="513" width="16" height="12" rx="5"/><rect x="305" y="543" width="16" height="12" rx="5"/>
  </g>
  <g class="s" style="font-size:10px;font-weight:700"><text x="282" y="456">S1</text><text x="282" y="486">S2</text><text x="282" y="516">S3</text><text x="282" y="546">S4</text></g>
  <circle cx="306" cy="612" r="2" fill="#475569"/><circle cx="320" cy="612" r="2" fill="#475569"/>
  <text x="208" y="384" class="t b">Stilling pipe</text>
  <text x="208" y="400" class="s">4 float switches</text>

  <!-- cable pipe to pole -->
  <path d="M313 392 L313 378 L430 378 L430 330" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="340" y="372" class="s">float cable</text>

  <!-- sensor pole -->
  <rect x="436" y="180" width="8" height="242" fill="#475569"/>
  <rect x="408" y="160" width="64" height="16" fill="#1e3a8a" transform="rotate(-12 440 168)"/>
  <rect x="404" y="250" width="72" height="80" rx="4" fill="#e5e7eb" stroke="#475569" stroke-width="1.5"/>
  <circle cx="440" cy="290" r="18" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="287" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#dc2626">EWS</text>
  <text x="440" y="297" text-anchor="middle" style="font-size:8px;font-weight:700;fill:#dc2626">RW11</text>
  <path d="M444 232 L466 232" fill="none" stroke="#475569" stroke-width="4"/>
  <rect x="464" y="225" width="10" height="14" rx="2" fill="#1f2937"/>
  <path d="M474 227 L492 218 L492 246 L474 237 Z" fill="#1f2937"/>
  <ellipse cx="492" cy="232" rx="4" ry="14" fill="#dc2626" stroke="#991b1b"/>
  <path d="M504 224 q10 8 0 16" class="wave"/><path d="M514 218 q16 14 0 28" class="wave"/>

  <g transform="translate(520,250)">
    <rect x="0" y="0" width="200" height="116" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="12" y="20" class="t b">Sensor node</text>
    <text x="12" y="38" class="s">TTGO T-Call (ESP32 + SIM800L)</text>
    <text x="12" y="54" class="s">DFPlayer + TDA2005 amp + siren</text>
    <text x="12" y="70" class="s">RF remote receiver</text>
    <text x="12" y="86" class="s">Solar panel, 12 V 7.5 Ah battery</text>
    <text x="12" y="104" class="s">Firmware V9.1</text>
  </g>
  <path d="M520 290 L480 290" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- houses -->
  <g>
    <rect x="760" y="360" width="70" height="60" fill="#fef3c7" stroke="#92400e"/><path d="M750 362 L795 325 L840 362 Z" fill="#b45309"/>
    <rect x="785" y="388" width="18" height="32" fill="#92400e"/>
    <rect x="850" y="370" width="60" height="50" fill="#fef3c7" stroke="#92400e"/><path d="M842 372 L880 340 L918 372 Z" fill="#b45309"/>
    <rect x="930" y="355" width="75" height="65" fill="#fef3c7" stroke="#92400e"/><path d="M920 357 L967 318 L1015 357 Z" fill="#b45309"/>
    <rect x="958" y="386" width="18" height="34" fill="#92400e"/>
  </g>
  <text x="880" y="446" text-anchor="middle" class="t b">Residents</text>

  <!-- mobile network -->
  <g transform="translate(720,92)">
    <path d="M0 70 L14 0 L28 70" fill="none" stroke="#475569" stroke-width="2.5"/>
    <path d="M5 45 L23 45 M8 30 L20 30 M11 15 L17 15" stroke="#475569" stroke-width="2"/>
    <path d="M-10 4 q-8 10 0 20 M38 4 q8 10 0 20" fill="none" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="734" y="182" text-anchor="middle" class="t b">Mobile network</text>
  <text x="734" y="198" text-anchor="middle" class="s">GSM SMS</text>

  <!-- SMS paths -->
  <path d="M476 252 Q560 120 708 120" class="sms" marker-end="url(#ar)"/>
  <text x="528" y="108" class="s b" style="fill:#c2410c">SMS "SIAGA n" / "NORMAL"</text>
  <path d="M762 120 Q980 90 1122 300" class="sms" marker-end="url(#ar)"/>
  <text x="1000" y="120" class="s b" style="fill:#c2410c">primary: tower</text>
  <path d="M746 200 L850 262" class="sms" marker-end="url(#ar)"/>
  <text x="772" y="250" class="s b" style="fill:#c2410c">backup</text>

  <!-- phone -->
  <rect x="855" y="250" width="26" height="44" rx="5" fill="#0f172a"/>
  <rect x="858" y="255" width="20" height="32" rx="2" fill="#93c5fd"/>
  <text x="890" y="268" class="t b">Phones</text>
  <text x="890" y="284" class="s">SMS if a siren fails</text>

  <!-- siren tower -->
  <g stroke="#64748b" stroke-width="2.5" fill="none">
    <path d="M1150 420 L1170 150 L1190 150 L1210 420"/>
    <path d="M1153 380 L1206 340 M1206 380 L1153 340 M1157 320 L1202 280 M1202 320 L1157 280 M1161 260 L1198 220 M1198 260 L1161 220 M1165 200 L1194 165 M1194 200 L1165 165"/>
  </g>
  <path d="M1168 140 L1140 124 L1140 168 L1168 152 Z" fill="#e5e7eb" stroke="#475569"/>
  <path d="M1192 140 L1220 124 L1220 168 L1192 152 Z" fill="#e5e7eb" stroke="#475569"/>
  <path d="M1128 128 q-14 18 0 36" class="wave"/><path d="M1114 118 q-24 28 0 56" class="wave"/><path d="M1100 108 q-34 38 0 76" class="wave"/>
  <path d="M1232 128 q14 18 0 36" class="wave"/>
  <rect x="1098" y="330" width="44" height="56" rx="4" fill="#e5e7eb" stroke="#475569" stroke-width="1.5"/>
  <path d="M1120 386 L1120 420" stroke="#475569" stroke-width="4"/>

  <g transform="translate(1040,450)">
    <rect x="0" y="0" width="220" height="100" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="12" y="20" class="t b">Siren tower (receiver node)</text>
    <text x="12" y="38" class="s">TTGO T-Call (ESP32 + SIM800L)</text>
    <text x="12" y="54" class="s">DFPlayer + amplifier (220 V AC)</text>
    <text x="12" y="70" class="s">Horn speakers on lattice tower</text>
    <text x="12" y="88" class="s">220 V AC mains + 5 V adapter</text>
  </g>
  <path d="M1120 450 L1120 420" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- steps -->
  <rect x="0" y="650" width="1280" height="90" fill="#ffffff"/>
  <g class="t">
    <circle cx="44" cy="690" r="13" fill="#0f172a"/><text x="44" y="695" text-anchor="middle" style="fill:#fff;font-weight:700">1</text>
    <text x="66" y="686" class="b">Water rises in the pipe</text><text x="66" y="703" class="s">Highest closed float sets SIAGA 4 to 1</text>
    <circle cx="364" cy="690" r="13" fill="#0f172a"/><text x="364" y="695" text-anchor="middle" style="fill:#fff;font-weight:700">2</text>
    <text x="386" y="686" class="b">Sensor node alerts</text><text x="386" y="703" class="s">Plays the stage audio and sends the SMS</text>
    <circle cx="684" cy="690" r="13" fill="#0f172a"/><text x="684" y="695" text-anchor="middle" style="fill:#fff;font-weight:700">3</text>
    <text x="706" y="686" class="b">Tower repeats the alert</text><text x="706" y="703" class="s">Same pre-recorded audio for the wider area</text>
    <circle cx="1004" cy="690" r="13" fill="#0f172a"/><text x="1004" y="695" text-anchor="middle" style="fill:#fff;font-weight:700">4</text>
    <text x="1026" y="686" class="b">Phones as backup</text><text x="1026" y="703" class="s">Residents get the SMS too</text>
  </g>
</svg>
